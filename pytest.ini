[pytest]
pythonpath = .
testpaths = tests
markers =
    models: needs ONNX model files in backend/models
    samples: needs KOMUTE_SAMPLES_DIR to exist and be non-empty
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning
    ignore:.*httpx.*:starlette.exceptions.StarletteDeprecationWarning
